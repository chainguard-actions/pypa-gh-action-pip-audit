name: Test ignore-vulns with vulnerable package
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create requirements file with vulnerable package
        run: |
          echo "pyyaml==5.1" > /tmp/vuln-ignore-requirements.txt

      - id: action
        uses: .
        with:
          inputs: /tmp/vuln-ignore-requirements.txt
          no-deps: "true"
          summary: "false"
          ignore-vulns: "PYSEC-2021-142 PYSEC-2022-42974"
          internal-be-careful-allow-failure: "true"

      - name: Assert action succeeded with ignored vulnerabilities
        run: |
          echo "Action completed successfully with vulnerabilities ignored"
          echo "PASS"
