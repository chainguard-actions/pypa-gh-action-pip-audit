name: Test basic pip-audit usage
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          inputs: "${{ github.workspace }}/test/empty.txt"
          no-deps: "true"
          internal-be-careful-allow-failure: "true"
      - name: Assert action completed successfully
        run: |
          echo "pip-audit action completed"
          echo "PASS"
