name: Test basic usage - empty requirements
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create empty requirements file
        run: |
          echo "" > /tmp/empty-requirements.txt

      - id: action
        uses: .
        with:
          inputs: /tmp/empty-requirements.txt
          no-deps: "true"
          summary: "false"
          internal-be-careful-allow-failure: "true"

      - name: Assert action succeeded
        run: |
          echo "Action completed successfully with no vulnerabilities"
          echo "PASS"
