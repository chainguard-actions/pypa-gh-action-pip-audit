name: Test allow-failure with vulnerable package
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create requirements file with vulnerable package
        run: |
          echo "pyyaml==5.1" > /tmp/vulnerable-requirements.txt

      - id: action
        uses: .
        with:
          inputs: /tmp/vulnerable-requirements.txt
          no-deps: "true"
          summary: "false"
          internal-be-careful-allow-failure: "true"

      - name: Assert action completed without failing the job
        run: |
          echo "Action completed successfully despite vulnerable package (allow-failure=true)"
          echo "PASS"
