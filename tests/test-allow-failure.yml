name: Test allow-failure flag with vulnerable package
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create a requirements file with a known-vulnerable package
        run: |
          # pip 21.1 has known vulnerabilities (CVE-2021-3572)
          cat > /tmp/vuln-requirements.txt <<'EOF'
          pip==21.1
          EOF
      - name: Run pip-audit on vulnerable requirements (allow failure)
        id: action
        uses: .
        with:
          inputs: "/tmp/vuln-requirements.txt"
          no-deps: "true"
          vulnerability-service: "PyPI"
          summary: "false"
          # This flag makes the action exit 0 even when vulnerabilities are found
          internal-be-careful-allow-failure: "true"
      - name: Assert action did not fail despite vulnerabilities
        run: |
          echo "pip-audit ran and allow-failure prevented job failure"
          echo "PASS"
