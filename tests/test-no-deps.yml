name: Test no-deps mode with pinned requirements
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create a pinned requirements file (no transitive deps needed)
        run: |
          # A minimal requirements file with a single pinned package
          cat > /tmp/pinned-requirements.txt <<'EOF'
          pip-audit==2.7.3
          EOF
      - name: Run pip-audit with no-deps flag
        id: action
        uses: .
        with:
          inputs: "/tmp/pinned-requirements.txt"
          no-deps: "true"
          vulnerability-service: "PyPI"
          summary: "false"
          internal-be-careful-allow-failure: "true"
      - name: Assert action completed with no-deps mode
        run: |
          echo "pip-audit ran in no-deps mode successfully"
          echo "PASS"
