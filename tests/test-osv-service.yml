name: Test pip-audit with OSV vulnerability service
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          inputs: "${{ github.workspace }}/test/empty.txt"
          no-deps: "true"
          vulnerability-service: "OSV"
      - name: Assert action completed with OSV service
        run: |
          echo "pip-audit completed using OSV vulnerability service"
          echo "PASS"
