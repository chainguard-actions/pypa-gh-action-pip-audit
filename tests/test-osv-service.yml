name: Test pip-audit with OSV vulnerability service
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a clean requirements file
        run: |
          cat > /tmp/test-requirements-osv.txt <<'EOF'
          # empty requirements - no packages to audit
          EOF

      - id: action
        uses: .
        with:
          inputs: /tmp/test-requirements-osv.txt
          no-deps: "true"
          summary: "false"
          vulnerability-service: "OSV"
          internal-be-careful-allow-failure: "false"

      - name: Assert action succeeded with OSV service
        run: |
          echo "pip-audit completed successfully using OSV vulnerability service"
          echo "PASS"
