name: Test OSV vulnerability service
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create a clean requirements file
        run: |
          cat > /tmp/osv-test-requirements.txt <<'EOF'
          pip-audit==2.7.3
          EOF
      - name: Run pip-audit with OSV vulnerability service
        id: action
        uses: .
        with:
          inputs: "/tmp/osv-test-requirements.txt"
          vulnerability-service: "OSV"
          no-deps: "true"
          summary: "false"
          internal-be-careful-allow-failure: "true"
      - name: Assert action completed using OSV service
        run: |
          echo "pip-audit ran with OSV vulnerability service successfully"
          echo "PASS"
