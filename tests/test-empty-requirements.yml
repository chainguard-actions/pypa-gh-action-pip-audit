name: Test pip-audit with empty requirements file
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          inputs: "${{ github.workspace }}/test/empty.txt"
          no-deps: "true"
      - name: Assert action completed successfully with no vulnerabilities
        run: |
          echo "pip-audit completed cleanly on empty requirements"
          echo "PASS"
