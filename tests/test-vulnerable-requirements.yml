name: Test pip-audit detects vulnerable requirements
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Ensure GITHUB_STEP_SUMMARY and GITHUB_OUTPUT are set
        run: |
          if [ -z "$GITHUB_STEP_SUMMARY" ]; then
            touch /tmp/step-summary.md
            echo "GITHUB_STEP_SUMMARY=/tmp/step-summary.md" >> "$GITHUB_ENV"
          fi
          if [ -z "$GITHUB_OUTPUT" ]; then
            touch /tmp/github-output.txt
            echo "GITHUB_OUTPUT=/tmp/github-output.txt" >> "$GITHUB_ENV"
          fi
      - name: Create vulnerable requirements file
        run: |
          echo "pyyaml==5.1" > /tmp/vulnerable-requirements.txt
      - id: action
        uses: .
        with:
          inputs: "/tmp/vulnerable-requirements.txt"
          no-deps: "true"
          summary: "false"
          vulnerability-service: "PyPI"
          # Allow failure since we expect vulnerabilities to be found
          internal-be-careful-allow-failure: "true"
      - name: Assert output is set (base64 encoded vulnerability report)
        env:
          ACTUAL: ${{ steps.action.outputs.internal-be-careful-output }}
        run: |
          echo "actual output (base64): $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: expected output to be set when vulnerabilities are found"
            exit 1
          fi
          # Decode and verify it contains vulnerability info
          DECODED=$(echo "$ACTUAL" | base64 -d)
          echo "decoded output: $DECODED"
          if [ -z "$DECODED" ]; then
            echo "FAIL: decoded output is empty"
            exit 1
          fi
          echo "PASS: vulnerability report was captured in output"
